[project]
name = "reliable-agents-code"
version = "0.3.0"
description = "Code for the book Reliable Agents: agentkit, every chapter's examples, and their recorded model responses."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic==2.6.0",
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentkit"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
pythonpath = ["."]
addopts = "-q"
